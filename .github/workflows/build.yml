# .github/workflows/build.yml
# MendezDDI - Version: 1.1.2
# Changelog:
# v1.1.2 - Ajuste de rutas para ejecutar compilación desde la raíz del repositorio.
# v1.1.1 - Corrección de sintaxis YAML en la línea 80 (bloques multilínea e Info.plist).
# v1.1.0 - Workflow completo para compilación, caché de DerivedData/SPM, empaquetado en IPA y publicación de Release con fecha/hora/segundo.
# v1.0.0 - Archivos base de la aplicación Swift/SwiftUI.

name: Build and Release MendezDDI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Seleccionar versión de Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Instalar libimobiledevice
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install libimobiledevice

      - name: Caché de DerivedData y Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.swift', '**/*.xcodeproj', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Compilar aplicación de macOS (MendezDDI)
        run: |
          mkdir -p build/Release-macos
          echo "Compilando aplicación de macOS..."
          swiftc -v -o build/Release-macos/MendezDDI \
                 -swift-version 5 \
                 -target arm64-apple-macos12.0 \
                 -I . \
                 -I/opt/homebrew/include \
                 -L/opt/homebrew/lib \
                 -framework SwiftUI \
                 -framework Foundation \
                 -framework UniformTypeIdentifiers \
                 -framework Security \
                 *.swift

      - name: Empaquetar en MendezDDI.app y crear .zip
        run: |
          mkdir -p MendezDDI.app/Contents/MacOS
          cp build/Release-macos/MendezDDI MendezDDI.app/Contents/MacOS/
          # Crear un Info.plist básico para la app de macOS
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>MendezDDI</string><key>CFBundleIdentifier</key><string>com.mendez.ddi</string><key>CFBundleName</key><string>MendezDDI</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleVersion</key><string>1</string></dict></plist>' > MendezDDI.app/Contents/Info.plist
          # Comprimir la aplicación en un archivo .zip
          zip -r MendezDDI.zip MendezDDI.app
          echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: MendezDDI-${{ env.TIMESTAMP }}
          name: Release MendezDDI-${{ env.TIMESTAMP }}
          body: |
            Compilación automática de **MendezDDI**.
            - **Fecha/Hora (UTC):** ${{ env.TIMESTAMP }}
            - **Archivo:** `MendezDDI.zip`
          files: MendezDDI.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
